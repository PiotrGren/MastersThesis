# ==============================================================================
# CONFIG: LogTransformer Fusion Training
# ==============================================================================

SYSTEM:
  OUTPUT_DIR: "./output/v4"
  DEVICE: "cuda"
  SEED: 169783

DATA:
  TRAIN_PATH: "../data/train_data.pt"
  VAL_PATH: "../data/val_data.pt"
  VOCAB_PATH: "../data/vocab.json"
  NUM_WORKERS: 0

MODEL:
  D_MODEL: 128
  TIME_FEAT_DIM: 4
  TIME_MLP_HIDDEN: 256
  NHEAD: 8
  NUM_LAYERS: 4
  DIM_FEEDFORWARD: 512
  MAX_SEQ_LEN: 500
  NUM_CLASSES: 5
  HEAD_HIDDEN: 256
  DROPOUT: 0.2

SOLVER:
  OPTIMIZER: "AdamW"
  BASE_LR: 0.0005
  WEIGHT_DECAY: 0.01
  CLIP_GRADIENTS: 1.0

  MAX_ITER: 5000
  USR_PER_BATCH: 32

  STEPS: [3000, 4000]
  GAMMA: 0.1

  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.001

PERIODS:
  LOG_PERIOD: 25
  EVAL_PERIOD: 250
  CHECKPOINT_PERIOD: 500